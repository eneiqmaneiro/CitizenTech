spring.application.name=ecosmart
server.port=${PORT:8080}

# Credenciais locais (arquivo ignorado pelo Git). Em producao, use as variaveis de ambiente DB_USER e DB_PASSWORD.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
